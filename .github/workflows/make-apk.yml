name: Build and release signed APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build unsigned release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run unit tests and assemble release
        run: ./gradlew test assembleRelease assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release-apk
          path: build/outputs/apk/release/KeyCraft-Sinhala-Keyboard-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-smoke-test-harness
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign and verify release APK
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: build-tools;36.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release-apk
          path: unsigned
      - name: Sign APK and verify trusted certificate
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          : "${RELEASE_KEYSTORE_BASE64:?Missing signing keystore}"
          : "${RELEASE_KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${RELEASE_KEY_ALIAS:?Missing signing alias}"
          : "${RELEASE_KEY_PASSWORD:?Missing signing key password}"
          : "${RELEASE_CERT_SHA256:?Configure the trusted release certificate SHA-256}"
          expected=$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/release.XXXXXX")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset RELEASE_KEYSTORE_BASE64
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          mkdir dist
          apk="KeyCraft-Sinhala-Keyboard-release.apk"
          "$apksigner" sign --ks "$keystore" --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD \
            --out "dist/$apk" "unsigned/KeyCraft-Sinhala-Keyboard-release-unsigned.apk"
          "$apksigner" verify --print-certs "dist/$apk" > dist/signature.txt
          actual=$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' dist/signature.txt)
          test "$actual" = "$expected"
          (cd dist && sha256sum "$apk" > "$apk.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keycraft-sinhala-keyboard-release
          path: |
            dist/KeyCraft-Sinhala-Keyboard-release.apk
            dist/KeyCraft-Sinhala-Keyboard-release.apk.sha256
            dist/signature.txt
          if-no-files-found: error
          retention-days: 7

  verify-release:
    name: Smoke-test signed APK on API ${{ matrix.api }}
    needs: sign
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: keycraft-sinhala-keyboard-release
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-smoke-test-harness
          path: harness
      - name: Verify signed artifact checksum
        working-directory: dist
        run: sha256sum --check KeyCraft-Sinhala-Keyboard-release.apk.sha256
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 scripts/smoke_release_apk.py dist/KeyCraft-Sinhala-Keyboard-release.apk harness

  release:
    name: Publish verified APK to GitHub Releases
    needs: verify-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: keycraft-sinhala-keyboard-release
          path: dist
      - name: Verify published artifact checksum
        working-directory: dist
        run: sha256sum --check KeyCraft-Sinhala-Keyboard-release.apk.sha256
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/KeyCraft-Sinhala-Keyboard-release.apk
            dist/KeyCraft-Sinhala-Keyboard-release.apk.sha256
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
